<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#182c2b"><title>孟子・憂患之旅｜生於憂患，死於安樂</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head><body>
<header><div><small>孟子・告子下</small><h1>孟子・憂患之旅</h1></div><nav aria-label="主要功能"><div class="modes" role="group" aria-label="閱讀模式"><button id="classical" aria-pressed="true">古文</button><button id="vernacular" aria-pressed="false">白話</button></div><button id="quizButton" class="primary">闖關測驗</button><button id="overview" type="button">全景</button><button id="mapButton">旅程地圖</button><button id="certificate">結業狀 <span id="progress">0/6</span></button><a href="./guide.html">學習指南</a><a href="./teacher.html">教師指引</a></nav></header>
<main><div id="travel" role="status" aria-live="polite" hidden><span>乘船沿河前往</span><strong id="travelName"></strong><small>按 Esc 略過</small><button id="skipTravel" type="button">略過</button></div><div id="scene" aria-label="可旋轉的 3D 故事場景"></div><details id="routePanel" open><summary>六站旅程</summary><div id="routeStops"></div></details><details id="storyPanel" open><summary>故事與閱讀</summary><section class="card" aria-live="polite"><div class="station-label" id="stationLabel"></div><h2 id="stationTitle"></h2><p id="subtitle"></p><div id="reading"></div><div class="actions"><button id="prev">上一段</button><span id="page"></span><button id="next">下一段</button><button id="read">朗讀</button><label class="auto-read"><input id="autoRead" type="checkbox"> 播完接下一段</label></div><p id="audioStatus" role="status"></p><details><summary>生詞注解</summary><dl id="gloss"></dl></details><p class="think" id="think"></p><div class="landmark-label">探索場景</div><div id="landmarks" class="actions" aria-label="場景特寫"></div><div class="actions"><button id="nextStation">乘船前往下一站</button></div></section></details></main>
<footer>原文：《孟子・告子下》｜白話與題目自行改寫｜陳乃誠（大乃老師）</footer>
<dialog id="intro" aria-labelledby="introTitle"><div class="intro-content"><p class="intro-kicker">孟子・告子下</p><h2 id="introTitle">孟子・憂患之旅</h2><p>乘船走訪六座島，讀孟子的文字，思考困境、支持與成長。</p><button id="startJourney" class="primary" type="button">開啟旅程</button><p class="intro-hint">可切換古文與白話，並在每站挑戰測驗。</p></div></dialog>
<dialog id="ending"><h2>走完六站</h2><p>一路從人物事例思考困境，也思考如何在安定時保持警覺。</p><p id="endingProgress"></p><div class="actions"><button id="endingCertificate" type="button">查看證書</button><button id="endingClose" type="button">繼續探索</button></div></dialog>
<dialog id="map"><h2>旅程地圖</h2><div id="stations"></div><form method="dialog"><button>關閉</button></form></dialog>
<dialog id="quiz"><h2 id="quizTitle"></h2><p>五題全部作答後交卷；答對三題即可計入證書。</p><form id="quizForm"></form><div class="actions"><button id="submitQuiz" class="primary">交卷</button><button id="closeQuiz">關閉</button></div><div id="result" aria-live="polite"></div></dialog>
<dialog id="cert"><h2>旅程結業證書</h2><p id="certStatus"></p><div id="certForm"><label>姓名 <input id="certName" maxlength="30" autocomplete="name"></label><div class="actions"><button id="certGu">文言結業狀</button><button id="certBai">白話結業證書</button></div><p>姓名與進度只保存在本機；不同瀏覽器與網址的紀錄可能不同。觸控裝置可長按圖片儲存。</p><img id="certImage" alt="結業證書預覽"><div class="actions"><a id="downloadCert" download="孟子旅程結業證書.png">下載證書</a><button id="shareCert" hidden>分享圖片</button><button id="printCert">列印</button></div></div><form method="dialog"><button>關閉</button></form></dialog>
<script type="module" src="./src/app.js"></script></body></html>
